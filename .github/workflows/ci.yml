name: CI

on:
  push:
    branches:
      - master
      - develop
  pull_request:

env:
  DOCKERFILE_LOCATION: docker/ubuntu.Dockerfile
  IMAGE: ghcr.io/${{ github.repository }}/ubuntu
  CONAN_USERNAME: micro-libraries
  CONAN_EXTRA_OPTIONS_DEV: ""
  CONAN_EXTRA_OPTIONS: ""

jobs:
  compute-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.slug.outputs.tag }}
      conan-channel: ${{ steps.channel.outputs.channel }}
    steps:
      - id: slug
        run: |
          RAW="${{ github.head_ref || github.ref_name }}"
          SLUG=$(printf '%s' "$RAW" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' | cut -c1-63)
          echo "tag=$SLUG" >> "$GITHUB_OUTPUT"
      - id: channel
        run: |
          # Mirrors .gitlab/conan.yml's .conan-channel rules.
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_name }}" = "${{ github.event.repository.default_branch }}" ]; then
            CHANNEL=stable
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_name }}" = "develop" ]; then
            CHANNEL=nightly
          else
            CHANNEL=default
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

  check-version-in-changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          VERSION=$(sed -n 's/.*VERSION \([^ ]*\) LANGUAGES.*/\1/p' CMakeLists.txt)
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_name }}" = "${{ github.event.repository.default_branch }}" ]; then
            grep -qE "^## \[${VERSION}\]" CHANGELOG.md
          else
            grep -qE "^## \[Unreleased\]|^## \[${VERSION}\]" CHANGELOG.md
          fi

  check-release-tag:
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true
      - run: |
          VERSION=$(sed -n 's/.*VERSION \([^ ]*\) LANGUAGES.*/\1/p' CMakeLists.txt)
          test -z "$(git ls-remote --tags origin | grep "refs/tags/v${VERSION}$")"

  build-image:
    needs: [compute-tag]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    env:
      TAG: ${{ needs.compute-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          docker build \
            --cache-from ${{ env.IMAGE }}:${{ env.TAG }} \
            --cache-from ${{ env.IMAGE }}:${{ github.event.repository.default_branch }} \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            -f ${{ env.DOCKERFILE_LOCATION }} . -t ${{ env.IMAGE }}:${{ env.TAG }}
          docker push ${{ env.IMAGE }}:${{ env.TAG }}

  conan-base:
    needs: [compute-tag, build-image, check-version-in-changelog]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}/ubuntu:${{ needs.compute-tag.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: conan config install conan/config
      - run: conan export conan/base-cmake-library/conanfile.py

  conan-dev:
    needs: [compute-tag, build-image, check-version-in-changelog]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}/ubuntu:${{ needs.compute-tag.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CONAN_CHANNEL: ${{ needs.compute-tag.outputs.conan-channel }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: conan config install conan/config
      - run: conan export conan/base-cmake-library/conanfile.py
      - name: Get package info
        run: |
          echo "PKG_NAME=$(conan inspect conan/conanfile-dev.py --format json | jq -r '.name')" >> $GITHUB_ENV
          echo "PKG_VERSION=$(conan inspect conan/conanfile-dev.py --format json | jq -r '.version')" >> $GITHUB_ENV
      - run: conan remove "$PKG_NAME/$PKG_VERSION@${{ env.CONAN_USERNAME }}/${{ env.CONAN_CHANNEL }}" -c || true
      - run: conan create conan/conanfile-dev.py -b missing --user=${{ env.CONAN_USERNAME }} --channel=${{ env.CONAN_CHANNEL }} ${{ env.CONAN_EXTRA_OPTIONS_DEV }}

  # For a lib package whose recipe requires a sibling dev package.
  conan-lib-with-dev:
    needs: [compute-tag, conan-dev]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}/ubuntu:${{ needs.compute-tag.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CONAN_CHANNEL: ${{ needs.compute-tag.outputs.conan-channel }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: conan config install conan/config
      - run: conan export conan/base-cmake-library/conanfile.py
      - name: Get package info
        run: |
          echo "PKG_NAME=$(conan inspect conan/conanfile.py --format json | jq -r '.name')" >> $GITHUB_ENV
          echo "PKG_VERSION=$(conan inspect conan/conanfile.py --format json | jq -r '.version')" >> $GITHUB_ENV
      - run: conan remove "$PKG_NAME/$PKG_VERSION@${{ env.CONAN_USERNAME }}/${{ env.CONAN_CHANNEL }}" -c || true
      - run: conan create conan/conanfile-dev.py -b missing --user=${{ env.CONAN_USERNAME }} --channel=${{ env.CONAN_CHANNEL }} ${{ env.CONAN_EXTRA_OPTIONS_DEV }}
      - run: conan create conan/conanfile.py -b missing --user=${{ env.CONAN_USERNAME }} --channel=${{ env.CONAN_CHANNEL }} ${{ env.CONAN_EXTRA_OPTIONS }}
