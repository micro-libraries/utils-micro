name: CI

on: [push, pull_request]

env:
  DOCKERFILE_LOCATION: docker/ubuntu.Dockerfile
  IMAGE: ghcr.io/${{ github.repository }}/ubuntu
  TAG: ${{ github.ref_name }}
  CONAN_USERNAME: micro-libraries
  CONAN_CHANNEL: default
  CONAN_EXTRA_OPTIONS_DEV: ""
  CONAN_EXTRA_OPTIONS: ""

jobs:
  build-image:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          docker build \
            --cache-from ${{ env.IMAGE }}:${{ env.TAG }} \
            --cache-from ${{ env.IMAGE }}:${{ github.event.repository.default_branch }} \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            -f ${{ env.DOCKERFILE_LOCATION }} . -t ${{ env.IMAGE }}:${{ env.TAG }}
          docker push ${{ env.IMAGE }}:${{ env.TAG }}

  conan-check-dev:
    needs: build-image
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}/ubuntu:${{ github.ref_name }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: conan config install conan/config
      - name: Get package info
        run: |
          echo "PKG_NAME=$(conan inspect conan/conanfile-dev.py --format json | jq -r '.name')" >> $GITHUB_ENV
          echo "PKG_VERSION=$(conan inspect conan/conanfile-dev.py --format json | jq -r '.version')" >> $GITHUB_ENV
      - run: conan remove "${{ env.PKG_NAME }}/${{ env.PKG_VERSION }}@${{ env.CONAN_USERNAME }}/${{ env.CONAN_CHANNEL }}" -c || true
      - run: conan create conan/conanfile-dev.py --user=${{ env.CONAN_USERNAME }} --channel=${{ env.CONAN_CHANNEL }} ${{ env.CONAN_EXTRA_OPTIONS_DEV }}

  conan-check:
    needs: build-image
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}/ubuntu:${{ github.ref_name }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: conan config install conan/config
      - name: Get package info
        run: |
          echo "PKG_NAME=$(conan inspect conan/conanfile.py --format json | jq -r '.name')" >> $GITHUB_ENV
          echo "PKG_VERSION=$(conan inspect conan/conanfile.py --format json | jq -r '.version')" >> $GITHUB_ENV
      - run: conan remove "${{ env.PKG_NAME }}/${{ env.PKG_VERSION }}@${{ env.CONAN_USERNAME }}/${{ env.CONAN_CHANNEL }}" -c || true
      - run: conan create conan/conanfile.py --user=${{ env.CONAN_USERNAME }} --channel=${{ env.CONAN_CHANNEL }} ${{ env.CONAN_EXTRA_OPTIONS }}
