include:
  - local: .gitlab/workflow.yml
  - local: .gitlab/versioning.yml
  - local: .gitlab/build-image.yml
  - local: .gitlab/conan.yml

variables:
  DOCKERFILE_LOCATION: docker/ubuntu.Dockerfile
  IMAGE: ${CI_REGISTRY_IMAGE}/ubuntu
  TAG: ${CI_COMMIT_REF_SLUG}
  CONAN_REMOTE: gitlab
  CONAN_EXTRA_OPTIONS_DEV: ""
  CONAN_EXTRA_OPTIONS: ""

default:
  tags: [saas-linux-small-amd64]
  image: ${IMAGE}:${TAG}
  interruptible: true
  timeout: 10m

build-image:
  extends: .build-image

check-release-tag:
  extends: .check-release-tag

check-version-in-changelog:
  extends: .check-version-in-changelog

conan:base:
  extends: .conan-needs
  script:
  - conan config install conan/config
  - conan export conan/base-cmake-library/conanfile.py
  - |
    if [ "${CI_COMMIT_BRANCH}" = "${CI_DEFAULT_BRANCH}" ]; then
      conan remote login ${CONAN_REMOTE} ci_user -p ${MICRO_LIBRARIES_CONAN_TOKEN}
      conan upload "base-cmake-library/1.0" -r ${CONAN_REMOTE} --force
    fi

conan:dev:
  extends: .conan-dev

conan:lib:
  extends: .conan-lib-with-dev
  needs:
  - conan:dev

add-release-tag:
  extends: .add-release-tag
  needs: [conan:base, conan:dev, conan:lib]
